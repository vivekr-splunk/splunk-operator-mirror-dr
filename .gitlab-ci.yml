    WORKFLOW_CLASS: release-bundle-publication
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_BUNDLE_PUSH_POST_RELEASE
    REQUIRED_VARS: STAGING_BUNDLE_REGISTRY,STAGING_RELEASE_NOTES_TARGET
    WORKFLOW_NOTES: The original workflow pushes post-release bundles with Docker credentials. The GitLab rehearsal must use staging bundle registries only. Real push credentials remain deferred until the live publication slice.
    WORKFLOW_PLAN: |
      1. Build the bundle image against a staging bundle registry only.
      2. Publish bundle metadata to staging destinations only.
      3. Record the exact bundle push and verification steps for the final runbook.
    EXECUTION_SCRIPT_FILE: hack/gitlab-ci/bundle-push-post-release-rehearsal.sh

release-charts-workflow-rehearsal:
  extends:
    - .workflow-rehearsal-template
    - .release-family
    - .required-rehearsal
    - .needs-release-controller
    - .rules-release-train-or-web-manual
  variables:
    WORKFLOW_SLUG: release-charts-workflow
    WORKFLOW_NAME: Release Charts Workflow
    SOURCE_WORKFLOW_FILE: .github/workflows/release.yml
    WORKFLOW_CLASS: release-charts
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_CHART_RELEASE
    REQUIRED_VARS: ""
    WORKFLOW_NOTES: GitHub chart-releaser output must be replaced with GitLab-driven OCI chart publication to an internal staging repository first. Public GitHub Pages must remain read-only until production cutover.
    WORKFLOW_PLAN: |
      1. Package charts in GitLab and publish them to an internal OCI chart repository first.
      2. Validate installability and publication metadata from that internal location before production cutover.
      3. Run chart publication and certification readiness checks before official publication.
      4. Keep the public GitHub Pages helm repo unchanged during rehearsal.
    EXECUTION_SCRIPT_FILE: hack/gitlab-ci/release-charts-workflow-rehearsal.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - rehearsal/

preflight-certification-rehearsal:
  extends:
    - .workflow-rehearsal-template
    - .release-family
    - .needs-release-controller
    - .rules-release-train-or-web-manual
  variables:
    WORKFLOW_SLUG: preflight-certification-workflow
    WORKFLOW_NAME: Preflight Certification Workflow
    SOURCE_WORKFLOW_FILE: openshift-preflight
    WORKFLOW_CLASS: release-certification
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_PREFLIGHT_CERTIFICATION
    REQUIRED_VARS: STAGING_PREFLIGHT_DOCKERCONFIG,STAGING_PYXIS_API_TOKEN,STAGING_PYXIS_CERTIFICATION_COMPONENT_ID
    WORKFLOW_NOTES: Red Hat certification needs both bundle and container preflight coverage. GitLab should emit the exact commands, evidence, and gating policy before any partner-portal submission.
    WORKFLOW_PLAN: |
      1. Run preflight against the operator bundle image and release container images.
      2. Capture operator and container evidence as a release gate.
      3. Block ecosystem submission until the preflight evidence is green.
    EXECUTION_SCRIPT_FILE: hack/gitlab-ci/preflight-certification-rehearsal.sh

ecosystem-submission-rehearsal:
  extends:
    - .workflow-rehearsal-template
    - .release-family
    - .needs-release-controller
    - .rules-release-train-or-web-manual
  variables:
    WORKFLOW_SLUG: ecosystem-submission-workflow
