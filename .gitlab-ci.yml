    SOURCE_WORKFLOW_FILE: community-operators/redhat-certification
    WORKFLOW_CLASS: release-ecosystem-submission
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_ECOSYSTEM_SUBMISSION
    REQUIRED_VARS: STAGING_OPERATORHUB_GITHUB_TOKEN,STAGING_RH_CERT_PROJECT_ID
    WORKFLOW_NOTES: OperatorHub and Red Hat certification submissions are downstream of the canonical GitLab release. GitLab should automate PR-ready payloads and submission packs, but external review and approval remain outside GitLab control.
    WORKFLOW_PLAN: |
      1. Prepare the OperatorHub and upstream-community-operators PR payloads.
      2. Prepare the Red Hat certification submission pack from the release evidence bundle.
      3. Keep external PR creation and partner-portal mutation disabled during rehearsal.
    EXECUTION_SCRIPT_FILE: hack/gitlab-ci/ecosystem-submission-rehearsal.sh

release-branch-to-main-rehearsal:
  extends:
    - .workflow-rehearsal-template
    - .administration-family
    - .needs-release-controller
    - .rules-release-train-or-web-manual
  variables:
    WORKFLOW_SLUG: release-branch-to-main-workflow
    WORKFLOW_NAME: Release Branch To Main Governance Workflow
    SOURCE_WORKFLOW_FILE: .github/workflows/merge-develop-to-main-workflow.yml
    WORKFLOW_CLASS: release-governance
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_RELEASE_BRANCH_TO_MAIN
    REQUIRED_VARS: STAGING_RELEASE_VERSION,STAGING_ENTERPRISE_VERSION,STAGING_RELEASE_CANDIDATE_VERSION
    WORKFLOW_NOTES: The GitHub workflow creates a PR and then drives RC publication. The GitLab equivalent should cut release/<version> from an approved develop commit, create an MR from release/<version> to main, and keep all downstream release activity pointed at staging targets.
    WORKFLOW_PLAN: |
      1. Create release/<version> from an approved develop commit.
      2. Create a GitLab MR from release/<version> to main instead of a direct develop-to-main GitHub PR.
      3. Validate mergeability and release metadata generation without pushing public artifacts.
      4. Keep RC image publication confined to staging release repositories.
    EXECUTION_SCRIPT_FILE: hack/gitlab-ci/release-branch-to-main-rehearsal.sh

cla-check-intake-note:
