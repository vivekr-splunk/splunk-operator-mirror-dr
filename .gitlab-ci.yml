    WORKFLOW_CLASS: github-intake-automation
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_GITHUB_INTAKE_AUTOMATION
    REQUIRED_VARS: ""
    WORKFLOW_NOTES: Post-cutover GitHub intake must remain metadata-only. The GitHub issue and PR workflows should create linked GitLab records without ever becoming an authoritative merge path.
    WORKFLOW_PLAN: |
      1. Validate the checked-in GitHub issue intake workflow.
      2. Validate the checked-in GitHub PR intake workflow.
      3. Ensure the PR intake path uses pull_request_target with trusted base-repository checkout only.
      4. Keep GitHub and GitLab mutation disabled in the GitLab-side rehearsal validation job.
    EXECUTION_SCRIPT_FILE: hack/gitlab-ci/github-intake-automation-rehearsal.sh

github-mirror-health-check-rehearsal:
  extends:
