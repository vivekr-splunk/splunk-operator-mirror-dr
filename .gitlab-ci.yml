workflow:
  rules:
    - when: always

stages:
  - verify
  - test
  - security
  - build
  - image_scan
  - integration
  - release
  - administration

variables:
  GIT_DEPTH: "0"
  GOCACHE: "/tmp/go-build"
  GOMODCACHE: "/go/pkg/mod"
  GOWORK: "off"

default:
  image: golang:1.24.2
  interruptible: true
  before_script:
    - rm -rf .cache/go
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git make net-tools
    - go version
  cache:
    key: "go-v2-${CI_COMMIT_REF_SLUG}"
    paths:
      - bin/

.workflow-rehearsal-template:
  image: alpine:3.20
  allow_failure: true
  before_script: []
  dependencies: []
  script:
    - |
      set -eu
      mkdir -p rehearsal

      status_file="rehearsal/${WORKFLOW_SLUG}-status.txt"
      mode_file="rehearsal/${WORKFLOW_SLUG}-mode.txt"
      plan_file="rehearsal/${WORKFLOW_SLUG}-plan.txt"
      missing_file="rehearsal/${WORKFLOW_SLUG}-missing-vars.txt"
      execution_log="rehearsal/${WORKFLOW_SLUG}-execution.log"
      image_ref_file="rehearsal/${WORKFLOW_SLUG}-image-ref.txt"
      digest_file="rehearsal/${WORKFLOW_SLUG}-digest.txt"
      trivy_sarif_file="rehearsal/${WORKFLOW_SLUG}-trivy-results.sarif"
      trivy_text_file="rehearsal/${WORKFLOW_SLUG}-trivy-results.txt"
      : > "${missing_file}"
      : > "${execution_log}"
      : > "${image_ref_file}"
      : > "${digest_file}"
      : > "${trivy_sarif_file}"
      : > "${trivy_text_file}"

      execute_value="false"
      if [ -n "${EXECUTE_FLAG_NAME:-}" ]; then
        execute_value="$(printenv "${EXECUTE_FLAG_NAME}" 2>/dev/null || true)"
        if [ -z "${execute_value}" ]; then
          execute_value="false"
        fi
      fi

      missing_vars=""
      if [ -n "${REQUIRED_VARS:-}" ]; then
        old_ifs="${IFS}"
        IFS=','
        for raw_var in ${REQUIRED_VARS}; do
          var_name="$(echo "${raw_var}" | sed 's/^ *//; s/ *$//')"
          [ -z "${var_name}" ] && continue
          var_value="$(printenv "${var_name}" 2>/dev/null || true)"
          if [ -z "${var_value}" ]; then
            printf '%s\n' "${var_name}" >> "${missing_file}"
            missing_vars="${missing_vars}${missing_vars:+,}${var_name}"
          fi
        done
        IFS="${old_ifs}"
      fi

      printf '%s\n' "${WORKFLOW_PLAN:-No workflow plan recorded for this rehearsal job.}" > "${plan_file}"

      {
        echo "workflow_name=${WORKFLOW_NAME}"
        echo "source_workflow_file=${SOURCE_WORKFLOW_FILE}"
        echo "workflow_class=${WORKFLOW_CLASS}"
        echo "execute_flag_name=${EXECUTE_FLAG_NAME:-none}"
        echo "execute_flag_value=${execute_value}"
        echo "required_vars=${REQUIRED_VARS:-none}"
        echo "missing_vars=${missing_vars:-none}"
        echo "notes=${WORKFLOW_NOTES:-none}"
        echo "registry_policy=Internal registry only for current rehearsal execution. DockerHub and other public-release destinations stay disabled until the pre-release and release workstreams are explicitly implemented later."
        echo "production_guard=This rehearsal job must not push to DockerHub or any production registry. Only STAGING_* internal destinations are allowed when execution is enabled."
      } | tee "${status_file}"

      if [ "${execute_value}" != "true" ]; then
        echo "plan-only" | tee "${mode_file}"
        exit 0
      fi

      if [ -n "${missing_vars}" ]; then
        echo "blocked-missing-vars" | tee "${mode_file}"
        exit 0
      fi

      if [ -n "${EXECUTION_SCRIPT:-}" ]; then
        printf '%s\n' "${EXECUTION_SCRIPT}" > rehearsal/${WORKFLOW_SLUG}-execution-script.sh
        chmod +x rehearsal/${WORKFLOW_SLUG}-execution-script.sh
        sh rehearsal/${WORKFLOW_SLUG}-execution-script.sh 2>&1 | tee "${execution_log}"
        echo "executed-runtime" | tee "${mode_file}"
        exit 0
      fi

      echo "execution-requested-prereqs-satisfied-but-concrete-runtime-steps-not-yet-implemented" | tee "${mode_file}"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - rehearsal/${WORKFLOW_SLUG}-status.txt
      - rehearsal/${WORKFLOW_SLUG}-mode.txt
      - rehearsal/${WORKFLOW_SLUG}-plan.txt
      - rehearsal/${WORKFLOW_SLUG}-missing-vars.txt
      - rehearsal/${WORKFLOW_SLUG}-execution.log
      - rehearsal/${WORKFLOW_SLUG}-image-ref.txt
      - rehearsal/${WORKFLOW_SLUG}-digest.txt
      - rehearsal/${WORKFLOW_SLUG}-trivy-results.sarif
      - rehearsal/${WORKFLOW_SLUG}-trivy-results.txt

format-and-vet:
  stage: verify
  variables:
    GOFLAGS: "-mod=mod"
  script:
    - make fmt
    - make vet

bias-language:
  stage: verify
  image: python:3.11-bookworm
  variables:
    PIP_INDEX_URL: "https://pypi.org/simple"
  before_script:
    - rm -rf .cache/go
    - apt-get update
    - apt-get install -y --no-install-recommends git ripgrep
    - python --version
  script:
    - git clone https://github.com/splunk/biased-lang-linter.git .biaslanguage
    - python -m venv /tmp/bias-language-venv
    - . /tmp/bias-language-venv/bin/activate
    - pip install --upgrade pip
    - pip install -r .biaslanguage/requirements.txt
    - cd .biaslanguage
    - python run_json.py --path="$CI_PROJECT_DIR" --err_file=err_biased_lang.log
  artifacts:
    when: always
    paths:
      - .biaslanguage/biased-language-summary.json
      - .biaslanguage/biased-language.codeclimate.json
      - .biaslanguage/biased_language.log
      - .biaslanguage/err_biased_lang.log
    reports:
      codequality: .biaslanguage/biased-language.codeclimate.json

unit-tests:
  stage: test
  needs:
    - format-and-vet
  variables:
    GOFLAGS: ""
  script:
    - make setup/ginkgo
    - go mod tidy
    - make test
    - go tool cover -func=coverage.out | tee coverage-summary.txt
  artifacts:
    when: always
    paths:
      - coverage.out
      - coverage-summary.txt
      - unit_test.xml
    reports:
      junit: unit_test.xml
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%$/'

kubectl-splunk-tests:
  stage: test
  image: python:3.11-bookworm
  variables:
    PIP_INDEX_URL: "https://pypi.org/simple"
  before_script:
    - rm -rf .cache/go
    - python --version
  script:
    - python -m venv /tmp/kubectl-splunk-venv
    - . /tmp/kubectl-splunk-venv/bin/activate
    - pip install --upgrade pip
    - pip install -r tools/kubectl-splunk/requirements.txt
    - pip install -e tools/kubectl-splunk
    - pip install coverage pytest
    - cd tools/kubectl-splunk
    - coverage run -m unittest discover -s tests
    - coverage report | tee "$CI_PROJECT_DIR/kubectl-splunk-coverage-summary.txt"
    - coverage xml -o "$CI_PROJECT_DIR/kubectl-splunk-coverage.xml"
  artifacts:
    when: always
    paths:
      - kubectl-splunk-coverage-summary.txt
      - kubectl-splunk-coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: kubectl-splunk-coverage.xml

semgrep-scan:
  stage: security
  image: returntocorp/semgrep
  before_script: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - |
      if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
        echo "SEMGREP_APP_TOKEN not set; skipping authenticated semgrep ci run" | tee semgrep-mode.txt
        printf '[]\n' > semgrep-results.json
        exit 0
      fi
      echo "Running semgrep ci with GitLab-managed token" | tee semgrep-mode.txt
      semgrep ci --json --output semgrep-results.json
  artifacts:
    when: always
    paths:
      - semgrep-mode.txt
      - semgrep-results.json

fossa-scan:
  stage: security
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - |
      if [ -z "${FOSSA_API_TOKEN:-}" ]; then
        echo "FOSSA_API_TOKEN not set; skipping FOSSA scan" | tee fossa-mode.txt
        : > fossa-scan.log
        exit 0
      fi
    - |
      if [ -n "${FOSSA_CLI_VERSION:-}" ]; then
        curl -fsSL https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash -s -- -b /usr/local/bin "${FOSSA_CLI_VERSION}"
      else
        curl -fsSL https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash -s -- -b /usr/local/bin
      fi
    - fossa --version
    - echo "Running FOSSA analyze/test with GitLab-managed token" | tee fossa-mode.txt
    - export FOSSA_API_KEY="${FOSSA_API_TOKEN}"
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        {
          fossa analyze --project "${CI_PROJECT_PATH}" --branch "${CI_COMMIT_REF_NAME}"
          fossa test --diff "${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
        } 2>&1 | tee fossa-scan.log
      else
        {
          fossa analyze --project "${CI_PROJECT_PATH}" --branch "${CI_COMMIT_REF_NAME}"
          fossa test
        } 2>&1 | tee fossa-scan.log
      fi
  artifacts:
    when: always
    paths:
      - fossa-mode.txt
      - fossa-scan.log

build-test-push-rehearsal:
  extends: .workflow-rehearsal-template
  stage: build
  image: docker:27.5.1-git
  allow_failure: false
  services:
    - name: docker:27.5.1-dind
      command:
        - --tls=false
  before_script:
    - apk add --no-cache bash curl jq make python3 py3-pip
    - pip3 install --no-cache-dir awscli
    - docker version
    - docker buildx version
    - aws --version
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    WORKFLOW_SLUG: build-test-push-workflow
    WORKFLOW_NAME: Build and Test
    SOURCE_WORKFLOW_FILE: .github/workflows/build-test-push-workflow.yml
    WORKFLOW_CLASS: build
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_BUILD_TEST_PUSH
    REQUIRED_VARS: STAGING_ECR_REPOSITORY,STAGING_AWS_ACCESS_KEY_ID,STAGING_AWS_SECRET_ACCESS_KEY,STAGING_AWS_DEFAULT_REGION
    WORKFLOW_NOTES: Base verify and test coverage is already live in GitLab CI. This rehearsal job now tracks the remaining image build, Trivy scan, and smoke-test path. Cosign signing is explicitly deferred to a later release-focused migration slice.
    WORKFLOW_PLAN: |
      1. Build the operator image only against a STAGING_ECR_REPOSITORY target.
      2. Push only the commit-scoped image tag to internal ECR. Do not update latest.
      3. Record the pushed image reference and digest for downstream scan and integration jobs.
      4. Record Trivy and smoke-test execution as separate downstream rehearsal steps.
    EXECUTION_SCRIPT: |
      set -eu
      export AWS_ACCESS_KEY_ID="${STAGING_AWS_ACCESS_KEY_ID}"
      export AWS_SECRET_ACCESS_KEY="${STAGING_AWS_SECRET_ACCESS_KEY}"
      export AWS_DEFAULT_REGION="${STAGING_AWS_DEFAULT_REGION}"
      export IMAGE_REF="${STAGING_ECR_REPOSITORY}/splunk/splunk-operator:${CI_COMMIT_SHA}"
      export PLATFORMS="linux/amd64"
      export DOCKER_BUILDKIT=1

      printf '%s\n' "${IMAGE_REF}" > "rehearsal/${WORKFLOW_SLUG}-image-ref.txt"

      aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | \
        docker login --username AWS --password-stdin "${STAGING_ECR_REPOSITORY}"

      make docker-buildx IMG="${IMAGE_REF}" PLATFORMS="${PLATFORMS}"

      docker buildx imagetools inspect "${IMAGE_REF}" | tee "rehearsal/${WORKFLOW_SLUG}-digest.txt"

build-test-push-trivy-scan:
  extends: .workflow-rehearsal-template
  stage: image_scan
  image: docker:27.5.1-git
  allow_failure: false
  needs:
    - job: build-test-push-rehearsal
      artifacts: true
  before_script:
    - apk add --no-cache bash curl jq python3 py3-pip
    - pip3 install --no-cache-dir awscli
    - TRIVY_VERSION="0.57.1"
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
    - trivy --version
    - aws --version
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    WORKFLOW_SLUG: build-test-push-trivy-scan
    WORKFLOW_NAME: Build and Test Trivy Image Scan
    SOURCE_WORKFLOW_FILE: .github/workflows/build-test-push-workflow.yml
    WORKFLOW_CLASS: image-scan
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_BUILD_TEST_PUSH
    REQUIRED_VARS: STAGING_ECR_REPOSITORY,STAGING_AWS_ACCESS_KEY_ID,STAGING_AWS_SECRET_ACCESS_KEY,STAGING_AWS_DEFAULT_REGION
    WORKFLOW_NOTES: This job scans only the staging ECR image produced by the standard build rehearsal. It does not upload to GitHub Security and it does not scan DockerHub.
    WORKFLOW_PLAN: |
      1. Read the staging image reference emitted by the build rehearsal job.
      2. Authenticate to staging ECR only.
      3. Run Trivy against the pushed image and publish SARIF/text artifacts in GitLab.
    EXECUTION_SCRIPT: |
      set -eu
      export AWS_ACCESS_KEY_ID="${STAGING_AWS_ACCESS_KEY_ID}"
      export AWS_SECRET_ACCESS_KEY="${STAGING_AWS_SECRET_ACCESS_KEY}"
      export AWS_DEFAULT_REGION="${STAGING_AWS_DEFAULT_REGION}"
      export IMAGE_REF="$(cat rehearsal/build-test-push-workflow-image-ref.txt)"
      export ECR_PASSWORD="$(aws ecr get-login-password --region "${AWS_DEFAULT_REGION}")"

      printf '%s\n' "${IMAGE_REF}" > "rehearsal/${WORKFLOW_SLUG}-image-ref.txt"

      trivy image \
        --username AWS \
        --password "${ECR_PASSWORD}" \
        --severity CRITICAL \
        --ignore-unfixed \
        --format sarif \
        --output "rehearsal/${WORKFLOW_SLUG}-trivy-results.sarif" \
        "${IMAGE_REF}"

      trivy image \
        --username AWS \
        --password "${ECR_PASSWORD}" \
        --severity CRITICAL \
        --ignore-unfixed \
        "${IMAGE_REF}" | tee "rehearsal/${WORKFLOW_SLUG}-trivy-results.txt"

distroless-build-test-push-rehearsal:
  extends: .workflow-rehearsal-template
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    WORKFLOW_SLUG: distroless-build-test-push-workflow
    WORKFLOW_NAME: Build and Test Distroless
    SOURCE_WORKFLOW_FILE: .github/workflows/distroless-build-test-push-workflow.yml
    WORKFLOW_CLASS: build-variant
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_DISTROLESS_BUILD
    REQUIRED_VARS: STAGING_ECR_REPOSITORY,STAGING_AWS_ACCESS_KEY_ID,STAGING_AWS_SECRET_ACCESS_KEY,STAGING_AWS_DEFAULT_REGION
    WORKFLOW_NOTES: This job tracks the distroless image and smoke-test path. Cosign signing remains deferred, and production DockerHub publication remains explicitly out of scope for this rehearsal.
    WORKFLOW_PLAN: |
      1. Build the distroless operator image to a staging registry only.
      2. Rehearse the distroless smoke-test path against staging EKS resources.
      3. Record cosign sign and verify as deferred until the dedicated release workflow migration slice.

int-test-workflow-rehearsal:
  extends: .workflow-rehearsal-template
  stage: integration
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    WORKFLOW_SLUG: int-test-workflow
    WORKFLOW_NAME: Integration Test Workflow
    SOURCE_WORKFLOW_FILE: .github/workflows/int-test-workflow.yml
    WORKFLOW_CLASS: integration-eks
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_EKS_INTEGRATION
    REQUIRED_VARS: STAGING_ECR_REPOSITORY,STAGING_AWS_ACCESS_KEY_ID,STAGING_AWS_SECRET_ACCESS_KEY,STAGING_AWS_DEFAULT_REGION,STAGING_EKS_VPC_PRIVATE_SUBNET_STRING,STAGING_EKS_VPC_PUBLIC_SUBNET_STRING,STAGING_TEST_BUCKET,STAGING_TEST_INDEXES_S3_BUCKET
    WORKFLOW_NOTES: This job tracks the full EKS integration matrix against non-production AWS targets only.
    WORKFLOW_PLAN: |
      1. Build the operator image into the staging ECR repository.
      2. Mirror the enterprise image into staging ECR only.
      3. Create an ephemeral staging EKS cluster and run the integration matrix.
      4. Collect logs, run cleanup, and tear the cluster down.

namespace-scope-int-workflow-rehearsal:
  extends: .workflow-rehearsal-template
  stage: integration
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  variables:
    WORKFLOW_SLUG: namespace-scope-int-workflow
    WORKFLOW_NAME: Namespace-scope Operator Integration Test Workflow
    SOURCE_WORKFLOW_FILE: .github/workflows/namespace-scope-int-workflow.yml
    WORKFLOW_CLASS: integration-eks-namespace-scope
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_NAMESPACE_SCOPE_INTEGRATION
    REQUIRED_VARS: STAGING_ECR_REPOSITORY,STAGING_AWS_ACCESS_KEY_ID,STAGING_AWS_SECRET_ACCESS_KEY,STAGING_AWS_DEFAULT_REGION,STAGING_EKS_VPC_PRIVATE_SUBNET_STRING,STAGING_EKS_VPC_PUBLIC_SUBNET_STRING,STAGING_TEST_BUCKET,STAGING_TEST_INDEXES_S3_BUCKET
    WORKFLOW_NOTES: This workflow is schedule-driven in GitHub. The GitLab rehearsal keeps it schedule-driven, with an MR manual hook for non-production validation.
    WORKFLOW_PLAN: |
      1. Run the namespace-scope integration matrix with CLUSTER_WIDE=false.
      2. Use staging EKS resources only.
      3. Preserve log collection and teardown in the same job flow.

manual-int-test-workflow-rehearsal:
  extends: .workflow-rehearsal-template
  stage: integration
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  variables:
    WORKFLOW_SLUG: manual-int-test-workflow
    WORKFLOW_NAME: Manual Integration Test Workflow
    SOURCE_WORKFLOW_FILE: .github/workflows/manual-int-test-workflow.yml
    WORKFLOW_CLASS: integration-eks-manual
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_MANUAL_INTEGRATION
    REQUIRED_VARS: STAGING_ECR_REPOSITORY,STAGING_AWS_ACCESS_KEY_ID,STAGING_AWS_SECRET_ACCESS_KEY,STAGING_AWS_DEFAULT_REGION,STAGING_EKS_VPC_PRIVATE_SUBNET_STRING,STAGING_EKS_VPC_PUBLIC_SUBNET_STRING,STAGING_TEST_BUCKET,STAGING_TEST_INDEXES_S3_BUCKET
    WORKFLOW_NOTES: This workflow remains manually invoked in GitLab. The execution path must use staging-only inputs and must not publish operator images to DockerHub.
    WORKFLOW_PLAN: |
      1. Accept CLUSTER_WIDE as a GitLab manual variable.
      2. Build and publish only to staging ECR.
      3. Run the integration suite against ephemeral staging EKS resources.
      4. Do not push the int tag to DockerHub during rehearsal or production cutover.

nightly-int-test-workflow-rehearsal:
  extends: .workflow-rehearsal-template
  stage: integration
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  variables:
    WORKFLOW_SLUG: nightly-int-test-workflow
    WORKFLOW_NAME: Nightly Integration Test Workflow
    SOURCE_WORKFLOW_FILE: .github/workflows/nightly-int-test-workflow.yml
    WORKFLOW_CLASS: integration-eks-nightly
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_NIGHTLY_INTEGRATION
    REQUIRED_VARS: STAGING_ECR_REPOSITORY,STAGING_AWS_ACCESS_KEY_ID,STAGING_AWS_SECRET_ACCESS_KEY,STAGING_AWS_DEFAULT_REGION,STAGING_EKS_VPC_PRIVATE_SUBNET_STRING,STAGING_EKS_VPC_PUBLIC_SUBNET_STRING,STAGING_TEST_BUCKET,STAGING_TEST_INDEXES_S3_BUCKET
    WORKFLOW_NOTES: This job maps the scheduled nightly path. The legacy DockerHub edge publication is intentionally excluded from the staging rehearsal.
    WORKFLOW_PLAN: |
      1. Build the operator image in staging ECR from develop.
      2. Run the nightly EKS integration suite against ephemeral staging infrastructure.
      3. Replace DockerHub edge publication with a staging-only validation artifact during rehearsal.

int-test-azure-workflow-rehearsal:
  extends: .workflow-rehearsal-template
  stage: integration
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    WORKFLOW_SLUG: int-test-azure-workflow
    WORKFLOW_NAME: Integration Test on Azure Workflow
    SOURCE_WORKFLOW_FILE: .github/workflows/int-test-azure-workflow.yml
    WORKFLOW_CLASS: integration-azure
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_AZURE_INTEGRATION
    REQUIRED_VARS: STAGING_AZURE_ACR_LOGIN_SERVER,STAGING_AZURE_ACR_DOCKER_USERNAME,STAGING_AZURE_ACR_DOCKER_PASSWORD,STAGING_AZURE_CREDENTIALS,STAGING_AZURE_RESOURCE_GROUP_NAME,STAGING_AZURE_CONTAINER_REGISTRY,STAGING_AZURE_STORAGE_ACCOUNT,STAGING_AZURE_STORAGE_ACCOUNT_KEY,STAGING_AZURE_TEST_CONTAINER,STAGING_AZURE_INDEXES_CONTAINER
    WORKFLOW_NOTES: This workflow provisions and tears down AKS resources. It must stay disabled until the Azure staging credential set is loaded.
    WORKFLOW_PLAN: |
      1. Build the operator image in staging ACR only.
      2. Provision a disposable AKS cluster in the staging resource group.
      3. Run the Azure sanity integration path and collect logs.
      4. Delete the staging AKS cluster at the end of the run.

int-test-gcp-workflow-rehearsal:
  extends: .workflow-rehearsal-template
  stage: integration
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    WORKFLOW_SLUG: int-test-gcp-workflow
    WORKFLOW_NAME: Integration Test on GCP Workflow
    SOURCE_WORKFLOW_FILE: .github/workflows/int-test-gcp-workflow.yml
    WORKFLOW_CLASS: integration-gcp
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_GCP_INTEGRATION
    REQUIRED_VARS: STAGING_GCP_ARTIFACT_REGISTRY,STAGING_GCP_SERVICE_ACCOUNT_KEY,STAGING_GCP_PROJECT_ID,STAGING_GCP_REGION,STAGING_GCP_ZONE,STAGING_TEST_BUCKET,STAGING_TEST_INDEXES_S3_BUCKET
    WORKFLOW_NOTES: This workflow provisions and tears down GKE resources. It must remain pointed at staging-only GCP projects and registries.
    WORKFLOW_PLAN: |
      1. Build the operator image in staging Artifact Registry only.
      2. Provision a disposable GKE cluster in the staging project.
