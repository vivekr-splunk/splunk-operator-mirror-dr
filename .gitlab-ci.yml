# GitLab CI architecture notes
# - This file is the authoritative GitLab CI entrypoint for the migration rehearsal.
# - Core CI, security, build, integration, release, and administration jobs are grouped into reusable workflow families.
# - Runtime jobs must stay staging-safe until the production cutover plan explicitly enables release/public destinations.
# - The hidden rehearsal template provides a uniform plan-only vs executable contract plus artifact-based observability.

workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - when: always

stages:
  - intake
  - verify
  - test
  - security
  - build
  - image_scan
  - integration
  - release
  - administration
  - notify

variables:
  GIT_DEPTH: "0"
  GOCACHE: "/tmp/go-build"
  GOMODCACHE: "/go/pkg/mod"
  GOWORK: "off"
  INTERNAL_CI_IMAGE: "docker.repo.splunkdev.net/ci-cd/ci-container/golang-1.25-aws:5.1.0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  REHEARSAL_PIPELINE_MODE: "full"
  SOK_SOURCE_MODE: "develop"
  SOK_TRIGGER_KIND: "develop-checkin"
  # Supported focused modes:
  # - build_scan
  # - eks_integration
  # - helm_integration
  # - cloud_runtime
  # - qualification_lane
  # - release_train
  # - chart_release
  # - variant_runtime

default:
  image: $INTERNAL_CI_IMAGE
  interruptible: true
  before_script:
    - |
      set -eu
      rm -rf .cache/go
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git make net-tools
      elif command -v dnf >/dev/null 2>&1; then
        dnf install -y ca-certificates curl git make net-tools
      elif command -v yum >/dev/null 2>&1; then
        yum install -y ca-certificates curl git make net-tools
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache ca-certificates curl git make net-tools
      else
        echo "No supported package manager found in base image" >&2
        exit 1
      fi
      go version
  cache:
    key: "go-v2-${CI_COMMIT_REF_SLUG}"
    paths:
      - bin/

# Shared rehearsal contract
# Every workflow-shaped job extends this template so migration tracking, required-variable checks,
# execution mode, and emitted artifacts stay consistent even while individual runtimes evolve.
.workflow-rehearsal-template:
  image: $INTERNAL_CI_IMAGE
  allow_failure: true
  before_script: []
  dependencies: []
  script:
    - |
      set -eu
      mkdir -p rehearsal

      status_file="rehearsal/${WORKFLOW_SLUG}-status.txt"
      mode_file="rehearsal/${WORKFLOW_SLUG}-mode.txt"
      plan_file="rehearsal/${WORKFLOW_SLUG}-plan.txt"
      missing_file="rehearsal/${WORKFLOW_SLUG}-missing-vars.txt"
      context_file="rehearsal/${WORKFLOW_SLUG}-context.txt"
      execution_log="rehearsal/${WORKFLOW_SLUG}-execution.log"
      image_ref_file="rehearsal/${WORKFLOW_SLUG}-image-ref.txt"
      digest_file="rehearsal/${WORKFLOW_SLUG}-digest.txt"
      trivy_sarif_file="rehearsal/${WORKFLOW_SLUG}-trivy-results.sarif"
      trivy_text_file="rehearsal/${WORKFLOW_SLUG}-trivy-results.txt"
      : > "${missing_file}"
      : > "${context_file}"
      : > "${execution_log}"
      : > "${image_ref_file}"
      : > "${digest_file}"
      : > "${trivy_sarif_file}"
      : > "${trivy_text_file}"

      execute_value="false"
      if [ -n "${EXECUTE_FLAG_NAME:-}" ]; then
        execute_value="$(printenv "${EXECUTE_FLAG_NAME}" 2>/dev/null || true)"
        if [ -z "${execute_value}" ]; then
          execute_value="false"
        fi
      fi

      missing_vars=""
      if [ -n "${REQUIRED_VARS:-}" ]; then
        old_ifs="${IFS}"
        IFS=','
        for raw_var in ${REQUIRED_VARS}; do
          var_name="$(echo "${raw_var}" | sed 's/^ *//; s/ *$//')"
          [ -z "${var_name}" ] && continue
          var_value="$(printenv "${var_name}" 2>/dev/null || true)"
          if [ -z "${var_value}" ]; then
            printf '%s\n' "${var_name}" >> "${missing_file}"
            missing_vars="${missing_vars}${missing_vars:+,}${var_name}"
          fi
        done
        IFS="${old_ifs}"
      fi

      printf '%s\n' "${WORKFLOW_PLAN:-No workflow plan recorded for this rehearsal job.}" > "${plan_file}"

      {
        echo "observed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "pipeline_mode=${REHEARSAL_PIPELINE_MODE:-full}"
        echo "pipeline_source=${CI_PIPELINE_SOURCE:-unknown}"
        echo "pipeline_id=${CI_PIPELINE_ID:-unknown}"
        echo "pipeline_url=${CI_PIPELINE_URL:-unknown}"
        echo "job_id=${CI_JOB_ID:-unknown}"
        echo "job_url=${CI_JOB_URL:-unknown}"
        echo "commit_sha=${CI_COMMIT_SHA:-unknown}"
        echo "ref_name=${CI_COMMIT_REF_NAME:-unknown}"
        echo "execution_script_file=${EXECUTION_SCRIPT_FILE:-none}"
      } > "${context_file}"

      {
        echo "workflow_name=${WORKFLOW_NAME}"
        echo "source_workflow_file=${SOURCE_WORKFLOW_FILE}"
        echo "workflow_class=${WORKFLOW_CLASS}"
        echo "execute_flag_name=${EXECUTE_FLAG_NAME:-none}"
        echo "execute_flag_value=${execute_value}"
        echo "required_vars=${REQUIRED_VARS:-none}"
        echo "missing_vars=${missing_vars:-none}"
        echo "notes=${WORKFLOW_NOTES:-none}"
        echo "registry_policy=Internal registry only for current rehearsal execution. DockerHub and other public-release destinations stay disabled until the pre-release and release workstreams are explicitly implemented later."
        echo "production_guard=This rehearsal job must not push to DockerHub or any production registry. Only STAGING_* internal destinations are allowed when execution is enabled."
      } | tee "${status_file}"

      if [ "${execute_value}" != "true" ]; then
        echo "plan-only" | tee "${mode_file}"
        exit 0
      fi

      if [ -n "${missing_vars}" ]; then
        echo "blocked-missing-vars" | tee "${mode_file}"
        exit 0
      fi

      if [ -n "${EXECUTION_SCRIPT_FILE:-}" ]; then
        cp "${EXECUTION_SCRIPT_FILE}" rehearsal/${WORKFLOW_SLUG}-execution-script.sh
        chmod +x rehearsal/${WORKFLOW_SLUG}-execution-script.sh
        sh "${EXECUTION_SCRIPT_FILE}" 2>&1 | tee "${execution_log}"
        echo "executed-runtime" | tee "${mode_file}"
        exit 0
      fi

      if [ -n "${EXECUTION_SCRIPT:-}" ]; then
        printf '%s\n' "${EXECUTION_SCRIPT}" > rehearsal/${WORKFLOW_SLUG}-execution-script.sh
        chmod +x rehearsal/${WORKFLOW_SLUG}-execution-script.sh
        sh rehearsal/${WORKFLOW_SLUG}-execution-script.sh 2>&1 | tee "${execution_log}"
        echo "executed-runtime" | tee "${mode_file}"
        exit 0
      fi

      echo "execution-requested-prereqs-satisfied-but-concrete-runtime-steps-not-yet-implemented" | tee "${mode_file}"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - rehearsal/${WORKFLOW_SLUG}-*
      - rehearsal/${WORKFLOW_SLUG}-status.txt
      - rehearsal/${WORKFLOW_SLUG}-mode.txt
      - rehearsal/${WORKFLOW_SLUG}-plan.txt
      - rehearsal/${WORKFLOW_SLUG}-missing-vars.txt
      - rehearsal/${WORKFLOW_SLUG}-context.txt
      - rehearsal/${WORKFLOW_SLUG}-execution.log
      - rehearsal/${WORKFLOW_SLUG}-image-ref.txt
      - rehearsal/${WORKFLOW_SLUG}-digest.txt
      - rehearsal/${WORKFLOW_SLUG}-trivy-results.sarif
      - rehearsal/${WORKFLOW_SLUG}-trivy-results.txt

# Reusable workflow families
# These hidden jobs centralize stage ownership, timeout policy, interruptibility, and build-artifact reuse.
.required-rehearsal:
  allow_failure: false

.intake-family:
  stage: intake
  interruptible: true

.build-family:
  stage: build
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GITLAB_OIDC_AUDIENCE

.image-scan-family:
  stage: image_scan
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GITLAB_OIDC_AUDIENCE

.integration-family-10h:
  stage: integration
  interruptible: false
  timeout: 10h
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GITLAB_OIDC_AUDIENCE

.integration-family-arm-5h:
  stage: integration
  interruptible: false
  timeout: 5h
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GITLAB_OIDC_AUDIENCE

.release-family:
  stage: release
  interruptible: false

.administration-family:
  stage: administration
  interruptible: false

.notification-family:
  stage: notify
  interruptible: false

.python-controller-bootstrap:
  before_script:
    - |
      set -eu
      if command -v python3 >/dev/null 2>&1; then
        python3 --version
      else
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3
        elif command -v yum >/dev/null 2>&1; then
          yum install -y python3
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache python3
        else
          echo "No supported package manager found in base image" >&2
          exit 1
        fi
        python3 --version
      fi

.needs-standard-build:
  dependencies:
    - build-test-push-rehearsal
  needs:
    - job: build-test-push-rehearsal
      artifacts: true

.needs-distroless-build:
  dependencies:
    - distroless-build-test-push-rehearsal
  needs:
    - job: distroless-build-test-push-rehearsal
      artifacts: true

.needs-arm-ubuntu-build:
  dependencies:
    - arm-ubuntu-build-test-push-rehearsal
  needs:
    - job: arm-ubuntu-build-test-push-rehearsal
      artifacts: true

.needs-arm-rhel-build:
  dependencies:
    - arm-rhel-build-test-push-rehearsal
  needs:
    - job: arm-rhel-build-test-push-rehearsal
      artifacts: true

.needs-arm-al2023-build:
  dependencies:
    - arm-al2023-build-test-push-rehearsal
  needs:
    - job: arm-al2023-build-test-push-rehearsal
      artifacts: true

.needs-release-controller:
  dependencies:
    - lane-select-rehearsal
  needs:
    - job: lane-select-rehearsal
      artifacts: true

# Shared trigger rules
# The migration keeps trigger logic centralized so MR, branch, schedule, web, and short-loop debug modes
# do not drift across workflow families.
.rules-core-standard:
  rules:
    - if: '$REHEARSAL_PIPELINE_MODE == "build_scan"'
      when: never
    - if: '$REHEARSAL_PIPELINE_MODE == "chart_release"'
      when: never
    - if: '$REHEARSAL_PIPELINE_MODE == "cloud_runtime"'
      when: never
    - if: '$REHEARSAL_PIPELINE_MODE == "eks_integration"'
      when: never
    - if: '$REHEARSAL_PIPELINE_MODE == "helm_integration"'
      when: never
    - if: '$REHEARSAL_PIPELINE_MODE == "release_train"'
      when: never
    - when: on_success

.rules-security-standard:
  rules:
    - if: '$REHEARSAL_PIPELINE_MODE == "chart_release"'
      when: never
    - if: '$REHEARSAL_PIPELINE_MODE == "cloud_runtime"'
      when: never
    - if: '$REHEARSAL_PIPELINE_MODE == "eks_integration"'
      when: never
    - if: '$REHEARSAL_PIPELINE_MODE == "helm_integration"'
      when: never
    - if: '$REHEARSAL_PIPELINE_MODE == "release_train"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

.rules-build-active:
  rules:
    - if: '$REHEARSAL_PIPELINE_MODE == "build_scan"'
    - if: '$REHEARSAL_PIPELINE_MODE == "cloud_runtime"'
    - if: '$REHEARSAL_PIPELINE_MODE == "eks_integration"'
    - if: '$REHEARSAL_PIPELINE_MODE == "qualification_lane"'
    - if: '$REHEARSAL_PIPELINE_MODE == "helm_integration"'
    - if: '$REHEARSAL_PIPELINE_MODE == "release_train"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

.rules-build-scan-and-eks:
  rules:
    - if: '$REHEARSAL_PIPELINE_MODE == "build_scan"'
    - if: '$REHEARSAL_PIPELINE_MODE == "eks_integration"'
    - if: '$REHEARSAL_PIPELINE_MODE == "qualification_lane"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

.rules-main-or-mr:
  rules:
    - if: '$REHEARSAL_PIPELINE_MODE == "cloud_runtime"'
    - if: '$REHEARSAL_PIPELINE_MODE == "variant_runtime"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

.rules-cloud-runtime-or-main-or-mr:
  rules:
    - if: '$REHEARSAL_PIPELINE_MODE == "cloud_runtime"'
    - if: '$REHEARSAL_PIPELINE_MODE == "variant_runtime"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

.rules-variant-runtime-or-main-or-mr:
  rules:
    - if: '$REHEARSAL_PIPELINE_MODE == "variant_runtime"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

.rules-eks-integration-or-main-or-mr:
  rules:
    - if: '$REHEARSAL_PIPELINE_MODE == "eks_integration"'
    - if: '$REHEARSAL_PIPELINE_MODE == "qualification_lane"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

.rules-helm-integration-or-main-or-mr-or-web:
  rules:
    - if: '$REHEARSAL_PIPELINE_MODE == "helm_integration"'
    - if: '$REHEARSAL_PIPELINE_MODE == "qualification_lane"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

.rules-qualification-or-release-train-or-web-manual:
  rules:
    - if: '$REHEARSAL_PIPELINE_MODE == "qualification_lane"'
    - if: '$REHEARSAL_PIPELINE_MODE == "release_train"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

.rules-web-or-mr-manual:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

.rules-variant-runtime-or-web-or-mr-manual:
  rules:
    - if: '$REHEARSAL_PIPELINE_MODE == "variant_runtime"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

.rules-schedule-or-mr-manual:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

.rules-main-or-mr-manual:
  rules:
    - if: '$REHEARSAL_PIPELINE_MODE == "chart_release"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

.rules-release-train-or-web-manual:
  rules:
    - if: '$REHEARSAL_PIPELINE_MODE == "release_train"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

.rules-mr-only:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Intake and controller family
# These jobs create the machine-readable cycle manifest, select the lane, and publish
# a first-class qualification record so downstream release and qualification jobs do not
# rely only on ad hoc STAGING_* flags.
release-manifest-resolve-rehearsal:
  extends:
    - .intake-family
    - .required-rehearsal
    - .python-controller-bootstrap
    - .rules-qualification-or-release-train-or-web-manual
  script:
    - python3 hack/gitlab-ci/release-manifest-resolve-rehearsal.py
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - rehearsal/release-controller/
    reports:
      dotenv: rehearsal/release-controller/release-cycle.env

lane-select-rehearsal:
  extends:
    - .intake-family
    - .required-rehearsal
    - .python-controller-bootstrap
    - .rules-qualification-or-release-train-or-web-manual
  needs:
    - job: release-manifest-resolve-rehearsal
      artifacts: true
  dependencies:
    - release-manifest-resolve-rehearsal
  script:
    - python3 hack/gitlab-ci/lane-select-rehearsal.py
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - rehearsal/release-controller/

# Baseline CI family
# These jobs are already proven live and form the required gate before build or release work can proceed.
format-and-vet:
  stage: verify
  extends: .rules-core-standard
  variables:
    GOFLAGS: "-mod=mod"
  script:
    - make fmt
    - make vet

bias-language:
  stage: verify
  extends: .rules-core-standard
  before_script:
    - |
      set -eu
      rm -rf .cache/go
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ripgrep python3 python3-pip python3-venv
      elif command -v dnf >/dev/null 2>&1; then
        dnf install -y git ripgrep python3 python3-pip
      elif command -v yum >/dev/null 2>&1; then
        yum install -y git ripgrep python3 python3-pip
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache git ripgrep python3 py3-pip
      else
        echo "No supported package manager found in base image" >&2
        exit 1
      fi
      python3 --version
  script:
    - git clone https://github.com/splunk/biased-lang-linter.git .biaslanguage
    - python3 -m venv /tmp/bias-language-venv
    - . /tmp/bias-language-venv/bin/activate
    - pip install --upgrade pip
    - pip install -r .biaslanguage/requirements.txt
    - cd .biaslanguage
    - python3 run_json.py --path="$CI_PROJECT_DIR" --err_file=err_biased_lang.log
  artifacts:
    when: always
    paths:
      - .biaslanguage/biased-language-summary.json
      - .biaslanguage/biased-language.codeclimate.json
      - .biaslanguage/biased_language.log
      - .biaslanguage/err_biased_lang.log
    reports:
      codequality: .biaslanguage/biased-language.codeclimate.json

unit-tests:
  stage: test
  extends: .rules-core-standard
  needs:
    - format-and-vet
  variables:
    GOFLAGS: ""
  script:
    - make setup/ginkgo
    - go mod tidy
    - make test
    - go tool cover -func=coverage.out | tee coverage-summary.txt
  artifacts:
    when: always
    paths:
      - coverage.out
      - coverage-summary.txt
      - unit_test.xml
    reports:
      junit: unit_test.xml
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%$/'

kubectl-splunk-tests:
  stage: test
  extends: .rules-core-standard
  before_script:
    - |
      set -eu
      rm -rf .cache/go
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-pip python3-venv
      elif command -v dnf >/dev/null 2>&1; then
        dnf install -y python3 python3-pip
      elif command -v yum >/dev/null 2>&1; then
        yum install -y python3 python3-pip
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache python3 py3-pip
      else
        echo "No supported package manager found in base image" >&2
        exit 1
      fi
      python3 --version
  script:
    - python3 -m venv /tmp/kubectl-splunk-venv
    - . /tmp/kubectl-splunk-venv/bin/activate
    - pip install --upgrade pip
    - pip install -r tools/kubectl-splunk/requirements.txt
    - pip install -e tools/kubectl-splunk
    - pip install coverage pytest
    - cd tools/kubectl-splunk
    - coverage run -m unittest discover -s tests
    - coverage report | tee "$CI_PROJECT_DIR/kubectl-splunk-coverage-summary.txt"
    - coverage xml -o "$CI_PROJECT_DIR/kubectl-splunk-coverage.xml"
  artifacts:
    when: always
    paths:
      - kubectl-splunk-coverage-summary.txt
      - kubectl-splunk-coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: kubectl-splunk-coverage.xml

semgrep-scan:
  stage: security
  extends: .rules-security-standard
  script:
    - |
      set -eu
      if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
        echo "SEMGREP_APP_TOKEN not set; skipping authenticated semgrep ci run" | tee semgrep-mode.txt
        printf '[]\n' > semgrep-results.json
        exit 0
      fi
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-pip python3-venv
      elif command -v dnf >/dev/null 2>&1; then
        dnf install -y python3 python3-pip
      elif command -v yum >/dev/null 2>&1; then
        yum install -y python3 python3-pip
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache python3 py3-pip
      else
        echo "No supported package manager found in base image" >&2
        exit 1
      fi
      python3 -m venv /tmp/semgrep-venv
      . /tmp/semgrep-venv/bin/activate
      pip install --upgrade pip
      pip install semgrep
      echo "Running semgrep ci with GitLab-managed token" | tee semgrep-mode.txt
      semgrep ci --json --output semgrep-results.json
  artifacts:
    when: always
    paths:
      - semgrep-mode.txt
      - semgrep-results.json

fossa-scan:
  stage: security
  extends: .rules-security-standard
  script:
    - |
      if [ -z "${FOSSA_API_TOKEN:-}" ]; then
        echo "FOSSA_API_TOKEN not set; skipping FOSSA scan" | tee fossa-mode.txt
        : > fossa-scan.log
        exit 0
      fi
    - |
      if [ -n "${FOSSA_CLI_VERSION:-}" ]; then
        curl -fsSL https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash -s -- -b /usr/local/bin "${FOSSA_CLI_VERSION}"
      else
        curl -fsSL https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash -s -- -b /usr/local/bin
      fi
    - fossa --version
    - echo "Running FOSSA analyze/test with GitLab-managed token" | tee fossa-mode.txt
    - export FOSSA_API_KEY="${FOSSA_API_TOKEN}"
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        {
          fossa analyze --project "${CI_PROJECT_PATH}" --branch "${CI_COMMIT_REF_NAME}"
          fossa test --diff "${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
        } 2>&1 | tee fossa-scan.log
      else
        {
          fossa analyze --project "${CI_PROJECT_PATH}" --branch "${CI_COMMIT_REF_NAME}"
          fossa test
        } 2>&1 | tee fossa-scan.log
      fi
  artifacts:
    when: always
    paths:
      - fossa-mode.txt
      - fossa-scan.log

# Image assurance family
# Standard build is the canonical upstream artifact for image scans and the first runtime families.
build-test-push-rehearsal:
  extends:
    - .workflow-rehearsal-template
    - .build-family
