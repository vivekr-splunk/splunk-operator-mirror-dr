    reports:
      junit: rehearsal/arm-al2023-int-test-workflow-inttest-junit.xml

# Release and administration family
# These jobs remain staging-safe and mostly rehearsal-first until the release-train implementation is complete.
# The production target is a linked release train:
# - cut release/<version> from an approved develop commit
# - promote release/<version> to main via GitLab MR
# - prepare release content and version updates
# - build and validate RC artifacts
# - trigger PSR release qualification
# - publish final release artifacts
# - publish and verify charts
# - publish bundles and catalogs
# - run preflight certification gates
# - assemble ecosystem submission payloads
pre-release-workflow-rehearsal:
  extends:
    - .workflow-rehearsal-template
    - .release-family
    - .needs-release-controller
    - .rules-release-train-or-web-manual
  variables:
    WORKFLOW_SLUG: pre-release-workflow
    WORKFLOW_NAME: Pre Release Workflow
    SOURCE_WORKFLOW_FILE: .github/workflows/pre-release-workflow.yml
    WORKFLOW_CLASS: release-preparation
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_PRE_RELEASE
    REQUIRED_VARS: STAGING_RELEASE_REPOSITORY,STAGING_RELEASE_BUCKET,STAGING_RELEASE_NOTES_TARGET
    WORKFLOW_NOTES: This workflow mutates release artifacts and versioned outputs. Rehearsal execution must target staging-only release destinations.
    WORKFLOW_PLAN: |
      1. Generate pre-release artifacts and version bumps only in a staging branch or disposable project.
      2. Publish artifacts only to staging release destinations.
      3. Capture the exact file diffs for later production cutover review.
    EXECUTION_SCRIPT_FILE: hack/gitlab-ci/pre-release-workflow-rehearsal.sh

automated-release-workflow-rehearsal:
  extends:
    - .workflow-rehearsal-template
    - .release-family
    - .needs-release-controller
    - .rules-release-train-or-web-manual
  variables:
    WORKFLOW_SLUG: automated-release-workflow
    WORKFLOW_NAME: Automated Release Workflow
    SOURCE_WORKFLOW_FILE: .github/workflows/automated-release-workflow.yml
    WORKFLOW_CLASS: release-publication
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_AUTOMATED_RELEASE
    REQUIRED_VARS: STAGING_RELEASE_REPOSITORY,STAGING_RELEASE_BUCKET,STAGING_RELEASE_NOTES_TARGET
    WORKFLOW_NOTES: The GitHub workflow publishes RC and release images. Until the later pre-release and release migration is implemented, GitLab rehearsal execution must stay on internal staging release registries only and must not touch DockerHub or public ECR names. Cosign signing remains deliberately deferred in this dry-run slice.
    WORKFLOW_PLAN: |
      1. Build RC and final release images only in internal staging release registries.
      2. Generate release artifacts against staging release targets.
      3. Keep DockerHub and public-registry publication disabled until the dedicated release-phase rehearsal.
      4. Record signing inputs, but do not require or perform cosign signing in this dry-run slice.
    EXECUTION_SCRIPT_FILE: hack/gitlab-ci/automated-release-workflow-rehearsal.sh

psr-release-qualification-rehearsal:
  extends:
    - .workflow-rehearsal-template
    - .release-family
    - .needs-release-controller
    - .rules-release-train-or-web-manual
  variables:
    WORKFLOW_SLUG: psr-release-qualification-workflow
    WORKFLOW_NAME: PSR Release Qualification Workflow
    SOURCE_WORKFLOW_FILE: psr/k8s-operator
    WORKFLOW_CLASS: release-qualification-psr
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_PSR_RELEASE
    REQUIRED_VARS: STAGING_PSR_BASE_VERSION
    WORKFLOW_NOTES: PSR is the long-running release-quality gate for upgrade, app-framework, and performance coverage. The GitLab release lane should gather the exact PSR trigger matrix before RC-to-GA approval.
    WORKFLOW_PLAN: |
      1. Prepare the PSR trigger matrix for upgrade, app-framework, and performance scenarios.
      2. Run the matrix against the release candidate version and target Splunk enterprise image.
      3. Collect PSR pipeline URLs and verdicts into the release qualification report before GA promotion.
    EXECUTION_SCRIPT_FILE: hack/gitlab-ci/psr-release-qualification-rehearsal.sh

psr-release-qualification-dispatch:
  stage: release
  needs:
    - job: release-manifest-resolve-rehearsal
      artifacts: true
    - job: psr-release-qualification-rehearsal
      artifacts: true
  rules:
    - if: '$STAGING_EXECUTE_PSR_RELEASE != "true"'
      when: never
    - if: '$REHEARSAL_PIPELINE_MODE == "release_train"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  variables:
    TEST_TYPE: $SOK_PSR_TRIGGER_TEST_TYPE
    BASE_VERSION: $SOK_PSR_BASE_VERSION
    TARGET_VERSION: $SOK_PSR_TARGET_VERSION
    IMAGE_SPLUNK_ENTERPRISE: $SOK_ENTERPRISE_IMAGE
  trigger:
    project: psr/k8s-operator
    branch: main
    strategy: depend
    forward:
      pipeline_variables: true

psr-release-qualification-collect:
  extends:
    - .administration-family
    - .required-rehearsal
    - .python-controller-bootstrap
    - .rules-release-train-or-web-manual
  needs:
    - job: psr-release-qualification-dispatch
  script:
    - python3 hack/gitlab-ci/psr-release-qualification-collect.py
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - rehearsal/release-controller/

bundle-push-post-release-rehearsal:
  extends:
    - .workflow-rehearsal-template
    - .release-family
    - .needs-release-controller
    - .rules-release-train-or-web-manual
  variables:
    WORKFLOW_SLUG: bundle-push-post-release-workflow
    WORKFLOW_NAME: Bundle Push Post Release Workflow
