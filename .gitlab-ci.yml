workflow:
  rules:
    - when: always

stages:
  - verify
  - test
  - security

variables:
  GIT_DEPTH: "0"
  GOCACHE: "/tmp/go-build"
  GOMODCACHE: "/go/pkg/mod"
  GOWORK: "off"

default:
  image: golang:1.24.2
  interruptible: true
  before_script:
    - rm -rf .cache/go
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git make net-tools
    - go version
  cache:
    key: "go-v2-${CI_COMMIT_REF_SLUG}"
    paths:
      - bin/

format-and-vet:
  stage: verify
  variables:
    GOFLAGS: "-mod=mod"
  script:
    - make fmt
    - make vet

bias-language:
  stage: verify
  image: python:3.11-bookworm
  variables:
    PIP_INDEX_URL: "https://pypi.org/simple"
  before_script:
    - rm -rf .cache/go
    - apt-get update
    - apt-get install -y --no-install-recommends git ripgrep
    - python --version
  script:
    - git clone https://github.com/splunk/biased-lang-linter.git .biaslanguage
    - python -m venv /tmp/bias-language-venv
    - . /tmp/bias-language-venv/bin/activate
    - pip install --upgrade pip
    - pip install -r .biaslanguage/requirements.txt
    - cd .biaslanguage
    - python run_json.py --path="$CI_PROJECT_DIR" --err_file=err_biased_lang.log
  artifacts:
    when: always
    paths:
      - .biaslanguage/biased-language-summary.json
      - .biaslanguage/biased-language.codeclimate.json
      - .biaslanguage/biased_language.log
      - .biaslanguage/err_biased_lang.log
    reports:
      codequality: .biaslanguage/biased-language.codeclimate.json

unit-tests:
  stage: test
  needs:
    - format-and-vet
  variables:
    GOFLAGS: ""
  script:
    - make setup/ginkgo
    - go mod tidy
    - make test
    - go tool cover -func=coverage.out | tee coverage-summary.txt
  artifacts:
    when: always
    paths:
      - coverage.out
      - coverage-summary.txt
      - unit_test.xml
    reports:
      junit: unit_test.xml
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%$/'

kubectl-splunk-tests:
  stage: test
  image: python:3.11-bookworm
  variables:
    PIP_INDEX_URL: "https://pypi.org/simple"
  before_script:
    - rm -rf .cache/go
    - python --version
  script:
    - python -m venv /tmp/kubectl-splunk-venv
    - . /tmp/kubectl-splunk-venv/bin/activate
    - pip install --upgrade pip
    - pip install -r tools/kubectl-splunk/requirements.txt
    - pip install -e tools/kubectl-splunk
    - pip install coverage pytest
    - cd tools/kubectl-splunk
    - coverage run -m unittest discover -s tests
    - coverage report | tee "$CI_PROJECT_DIR/kubectl-splunk-coverage-summary.txt"
    - coverage xml -o "$CI_PROJECT_DIR/kubectl-splunk-coverage.xml"
  artifacts:
    when: always
    paths:
      - kubectl-splunk-coverage-summary.txt
      - kubectl-splunk-coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: kubectl-splunk-coverage.xml

semgrep-scan:
  stage: security
  image: returntocorp/semgrep
  before_script: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - |
      if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
        echo "SEMGREP_APP_TOKEN not set; skipping authenticated semgrep ci run" | tee semgrep-mode.txt
        printf '[]\n' > semgrep-results.json
        exit 0
      fi
      echo "Running semgrep ci with GitLab-managed token" | tee semgrep-mode.txt
      semgrep ci --json --output semgrep-results.json
  artifacts:
    when: always
    paths:
      - semgrep-mode.txt
      - semgrep-results.json

fossa-scan:
  stage: security
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - |
      if [ -z "${FOSSA_API_TOKEN:-}" ]; then
        echo "FOSSA_API_TOKEN not set; skipping FOSSA scan" | tee fossa-mode.txt
        : > fossa-scan.log
        exit 0
      fi
    - |
      if [ -n "${FOSSA_CLI_VERSION:-}" ]; then
        curl -fsSL https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash -s -- -b /usr/local/bin "${FOSSA_CLI_VERSION}"
      else
        curl -fsSL https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash -s -- -b /usr/local/bin
      fi
    - fossa --version
    - echo "Running FOSSA analyze/test with GitLab-managed token" | tee fossa-mode.txt
    - export FOSSA_API_KEY="${FOSSA_API_TOKEN}"
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        {
          fossa analyze --project "${CI_PROJECT_PATH}" --branch "${CI_COMMIT_REF_NAME}"
          fossa test --diff "${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
        } 2>&1 | tee fossa-scan.log
      else
        {
          fossa analyze --project "${CI_PROJECT_PATH}" --branch "${CI_COMMIT_REF_NAME}"
          fossa test
        } 2>&1 | tee fossa-scan.log
      fi
  artifacts:
    when: always
    paths:
      - fossa-mode.txt
      - fossa-scan.log
