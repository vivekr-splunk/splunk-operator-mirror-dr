      2. Validate smoke-test prerequisites against staging-only dependencies.
    EXECUTION_SCRIPT_FILE: hack/gitlab-ci/build-test-push-buildx-rehearsal.sh
    BUILD_MODE: buildx
    BUILD_PLATFORMS: linux/arm64,linux/amd64
    BASE_IMAGE: public.ecr.aws/amazonlinux/amazonlinux
    BASE_IMAGE_VERSION: 2023

arm-al2023-int-test-workflow-rehearsal:
  extends:
    - .workflow-rehearsal-template
    - .integration-family-arm-5h
    - .required-rehearsal
    - .needs-arm-al2023-build
    - .rules-variant-runtime-or-web-or-mr-manual
  variables:
    WORKFLOW_SLUG: arm-al2023-int-test-workflow
    WORKFLOW_NAME: Arm AL2023 Integration Test Workflow
    SOURCE_WORKFLOW_FILE: .github/workflows/arm-AL2023-int-test-workflow.yml
    WORKFLOW_CLASS: integration-arm-al2023
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_ARM_AL2023_INTEGRATION
    JOB_INT_TEST_PROFILE: managersecret
    BUILD_IMAGE_REF_FILE: rehearsal/arm-al2023-build-test-push-workflow-image-ref.txt
    REQUIRED_VARS: STAGING_ECR_REPOSITORY,STAGING_AWS_ACCESS_KEY_ID,STAGING_AWS_SECRET_ACCESS_KEY,STAGING_AWS_DEFAULT_REGION,STAGING_EKS_VPC_PRIVATE_SUBNET_STRING,STAGING_EKS_VPC_PUBLIC_SUBNET_STRING,STAGING_TEST_BUCKET,STAGING_TEST_INDEXES_S3_BUCKET
    WORKFLOW_NOTES: This workflow now has a concrete ARM AL2023 integration contract. It consumes the matching staging build artifact in the same pipeline and uses the staging enterprise image explicitly.
    WORKFLOW_PLAN: |
      1. Build the ARM AL2023 operator image into staging ECR.
      2. Run the ARM AL2023 integration path against staging EKS resources.
    EXECUTION_SCRIPT_FILE: hack/gitlab-ci/int-test-workflow-rehearsal.sh
  artifacts:
