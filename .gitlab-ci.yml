    EXECUTE_FLAG_NAME: STAGING_EXECUTE_CLA_CHECK
    REQUIRED_VARS: ""
    WORKFLOW_NOTES: CLA and code-of-conduct checks remain on the GitHub intake surface after cutover. They are not part of the authoritative GitLab merge path.
    WORKFLOW_PLAN: |
      1. Keep CLA and CoC automation on the public GitHub intake repository.
      2. Ensure the GitHub intake workflow never becomes an authoritative merge gate after cutover.
    EXECUTION_SCRIPT_FILE: hack/gitlab-ci/cla-check-intake-note.sh

github-intake-automation-rehearsal:
