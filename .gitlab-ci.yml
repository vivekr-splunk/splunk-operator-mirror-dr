# Runtime validation family
# EKS, Helm, cross-cloud, namespace, nightly, and variant paths live here. The production target is a
# smaller number of parameterized runtime modules, but these jobs preserve source-workflow traceability
# during the migration program.
# The active EKS and Helm runtimes now support profile-driven partitioning:
# - EKS: STAGING_INT_TEST_PROFILE=managersecret|smoke|appframework|full|custom
# - Helm: STAGING_HELM_TEST_PROFILE=smoke|clustered|apps|full|custom
int-test-workflow-rehearsal:
  extends:
    - .workflow-rehearsal-template
    - .integration-family-10h
    - .required-rehearsal
    - .needs-standard-build
    - .rules-eks-integration-or-main-or-mr
  variables:
    WORKFLOW_SLUG: int-test-workflow
    WORKFLOW_NAME: Integration Test Workflow
    SOURCE_WORKFLOW_FILE: .github/workflows/int-test-workflow.yml
    WORKFLOW_CLASS: integration-eks
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_EKS_INTEGRATION
    REQUIRED_VARS: STAGING_ECR_REPOSITORY,STAGING_AWS_ACCESS_KEY_ID,STAGING_AWS_SECRET_ACCESS_KEY,STAGING_AWS_DEFAULT_REGION,STAGING_EKS_VPC_PRIVATE_SUBNET_STRING,STAGING_EKS_VPC_PUBLIC_SUBNET_STRING,STAGING_TEST_BUCKET,STAGING_TEST_INDEXES_S3_BUCKET
    WORKFLOW_NOTES: This job now executes the first real staging-only EKS integration runtime. It reuses the standard build artifact, mirrors the Splunk Enterprise image into staging ECR, provisions an ephemeral EKS cluster, runs one integration profile selected by STAGING_INT_TEST_PROFILE, and always performs cleanup.
    WORKFLOW_PLAN: |
      1. Reuse the operator image already built into staging ECR by the standard build rehearsal.
      2. Mirror the configured Splunk Enterprise image into staging ECR only.
      3. Create an ephemeral staging EKS cluster and run the selected integration profile and focus.
      4. Collect JUnit and pod-log artifacts, run cleanup, and tear the cluster down.
    EXECUTION_SCRIPT_FILE: hack/gitlab-ci/int-test-workflow-rehearsal.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - rehearsal/
    reports:
      junit: rehearsal/int-test-workflow-inttest-junit.xml

