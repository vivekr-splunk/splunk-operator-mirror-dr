  variables:
    WORKFLOW_SLUG: github-mirror-health-check
    WORKFLOW_NAME: GitHub Mirror Health Check Rehearsal
    SOURCE_WORKFLOW_FILE: gitlab-push-mirror
    WORKFLOW_CLASS: github-mirror
    EXECUTE_FLAG_NAME: STAGING_EXECUTE_GITHUB_MIRROR_CHECK
    REQUIRED_VARS: STAGING_GITHUB_MIRROR_REPO
    WORKFLOW_NOTES: GitLab must become the authoritative source while GitHub stays a downstream mirror. This rehearsal job performs only read-only parity checks against the configured GitHub repository.
    WORKFLOW_PLAN: |
      1. Read branch parity from the configured GitHub mirror target.
      2. Compare GitHub refs to the current GitLab repository refs.
      3. Record drift without mutating GitHub mirror settings.
      4. Reserve mirror enable, disable, and repair actions for the dedicated rollback drill.
    EXECUTION_SCRIPT_FILE: hack/gitlab-ci/mirror-health-check.sh

